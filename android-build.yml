name: Build Hesabdari Rad APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hesabdari_Rad_Source_v4.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check source archive
        run: test -f Hesabdari_Rad_Source_v4.zip

      - name: Unpack source project
        run: |
          unzip -q Hesabdari_Rad_Source_v4.zip -d unpacked
          test -f unpacked/hesabdari_rad/app/build.gradle
          test -f unpacked/hesabdari_rad/settings.gradle

      - name: Build debug APK
        working-directory: unpacked/hesabdari_rad
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Rad-debug-APK
          path: unpacked/hesabdari_rad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
